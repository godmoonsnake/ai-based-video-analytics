# DARSON Intelligence Layer — hardened full-stack demo deployment.
#
# Single browser origin via the `proxy` service (http://localhost:8080):
#   /            -> frontend (built dashboard, static)
#   /api, /events, /tracks, /incidents, ... -> backend
#   /frigate/... -> Frigate media/API (browser-reachable evidence)
#
# Data plane:
#   backend -> PostgreSQL + pgvector (the E2E database; schema via Alembic)
#   Frigate -> Mosquitto (MQTT) -> FrigateAdapter -> CanonicalEvent -> pipeline
#
# The default event source is the deterministic MOCK scenario (repeatable
# intelligence). Frigate + Mosquitto provide the real infrastructure/MQTT path;
# the synthetic Frigate camera produces NO person detections (see README).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: darson
      POSTGRES_PASSWORD: darson
      POSTGRES_DB: darson
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darson -d darson"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # mosquitto_sub returns promptly if the broker is accepting connections.
      test: ["CMD-SHELL", "timeout 3 mosquitto_sub -h localhost -t '$$SYS/#' -C 1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    stop_grace_period: 30s
    shm_size: "128mb"
    depends_on:
      mosquitto:
        condition: service_healthy
    volumes:
      - ./deploy/frigate-config.yml:/config/config.yml:ro
      - frigate_media:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"   # Authenticated UI/API
      - "5000:5000"   # Internal unauthenticated API (integration + evidence)
      - "8554:8554"   # RTSP restream (go2rtc)
      - "8555:8555/tcp"
      - "8555:8555/udp"
    environment:
      TZ: "UTC"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    environment:
      # PostgreSQL + pgvector is the E2E database. Schema is migration-driven
      # (init_db runs alembic upgrade head on Postgres).
      DARSON_DATABASE_URL: postgresql+psycopg2://darson:darson@db:5432/darson
      DARSON_EVENT_SOURCE: mock
      DARSON_FRIGATE_MQTT_HOST: mosquitto
      DARSON_FRIGATE_API_BASE: http://frigate:5000
      # Browser-facing evidence base: relative, routed by the proxy to Frigate.
      DARSON_FRIGATE_PUBLIC_BASE: /frigate
      DARSON_EVIDENCE_ROOT: /app/var/evidence
      DARSON_SPOOL_ROOT: /app/var/spool
    volumes:
      - darson_state:/app/var
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    command: ["python", "-m", "app.processing.worker"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      DARSON_DATABASE_URL: postgresql+psycopg2://darson:darson@db:5432/darson
      DARSON_ENVIRONMENT: development
      DARSON_WORKER_TENANT: development
      DARSON_WORKER_SITE: site_a
      DARSON_EVIDENCE_ROOT: /app/var/evidence
      DARSON_SPOOL_ROOT: /app/var/spool
    volumes:
      - darson_state:/app/var

  health-worker:
    build: ./backend
    command: ["python", "-m", "app.processing.worker", "health"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      frigate: { condition: service_healthy }
    environment:
      DARSON_DATABASE_URL: postgresql+psycopg2://darson:darson@db:5432/darson
      DARSON_ENVIRONMENT: development
      DARSON_WORKER_TENANT: development
      DARSON_WORKER_SITE: site_a
      DARSON_FRIGATE_API_BASE: http://frigate:5000
    volumes:
      - darson_state:/app/var

  connector:
    build: ./backend
    command: ["python", "-m", "app.processing.worker", "connector"]
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    environment:
      DARSON_DATABASE_URL: postgresql+psycopg2://darson:darson@db:5432/darson
      DARSON_ENVIRONMENT: development
      DARSON_WORKER_TENANT: development
      DARSON_WORKER_SITE: site_a
      DARSON_SOURCE_INSTANCE: frigate-local
      DARSON_FRIGATE_MQTT_HOST: mosquitto
      DARSON_FRIGATE_API_BASE: http://frigate:5000
      DARSON_SPOOL_ROOT: /app/var/spool
    volumes:
      - darson_state:/app/var

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Synthetic demo evidence (scripts/generate_mock_evidence.py): the mock
      # event source fabricates /mock-evidence/<camera>/<track>/... URLs; this
      # mount lets the frontend nginx serve them at the same origin.
      - ./deploy/mock-evidence:/usr/share/nginx/html/mock-evidence:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
      frigate:
        condition: service_healthy
    volumes:
      - ./deploy/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"   # <-- the single browser origin for the demo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  db_data:
  frigate_media:
  darson_state:
