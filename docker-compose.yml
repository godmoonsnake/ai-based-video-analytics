# DARSON Intelligence Layer — deployment stack.
# The intelligence layer sits ABOVE an existing VMS. Frigate is included only as
# an OPTIONAL event source for the real adapter (profile "frigate"); the default
# demo path uses the built-in mock event source and needs only db + mosquitto.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: darson
      POSTGRES_PASSWORD: darson
      POSTGRES_DB: darson
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darson"]
      interval: 5s
      timeout: 5s
      retries: 10

  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DARSON_DATABASE_URL: postgresql+psycopg2://darson:darson@db:5432/darson
      DARSON_EVENT_SOURCE: mock
      DARSON_FRIGATE_MQTT_HOST: mosquitto
      DARSON_FRIGATE_API_BASE: http://frigate:5000
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"

  # Optional: run Frigate as a real event source. Enable with:
  #   docker compose --profile frigate up
  #
  # Uses a synthetic test-pattern camera (deploy/frigate-config.yml) so it needs
  # NO real CCTV credentials and NO physical cameras. Frigate publishes real
  # frigate/events messages to mosquitto, which the backend's FrigateMqttSource
  # consumes when DARSON_EVENT_SOURCE=frigate.
  frigate:
    image: ghcr.io/blakeblackshear/frigate:stable
    profiles: ["frigate"]
    restart: unless-stopped
    stop_grace_period: 30s
    # SHM for a single 720p detect stream (see Frigate SHM calculator). Raise for
    # more/higher-resolution cameras.
    shm_size: "128mb"
    depends_on:
      - mosquitto
    volumes:
      - ./deploy/frigate-config.yml:/config/config.yml:ro
      - frigate_media:/media/frigate
      # In-memory cache for recording segments (recommended by Frigate docs).
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"   # Authenticated UI/API
      - "5000:5000"   # Internal unauthenticated API — what DARSON integrates against
      - "8554:8554"   # RTSP restream (go2rtc)
      - "8555:8555/tcp"  # WebRTC
      - "8555:8555/udp"  # WebRTC
    environment:
      TZ: "UTC"

volumes:
  db_data:
  frigate_media:
