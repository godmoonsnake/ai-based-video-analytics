# Static file server for the built dashboard (behind the reverse proxy).
# Serves assets and falls back to index.html for client-side routes. It does not
# proxy the API — the dedicated `proxy` service handles /api and /frigate.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets; never cache index.html.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight liveness endpoint for the container healthcheck.
    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok";
    }
}
