upstream darson_backend { server backend:8000; }
upstream darson_frontend { server frontend:80; }
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;
    location = /healthz { add_header Content-Type text/plain; return 200 "ok"; }
    location /api { proxy_pass http://darson_backend; }
    location /events { proxy_pass http://darson_backend; }
    location /tracks { proxy_pass http://darson_backend; }
    location /incidents { proxy_pass http://darson_backend; }
    location /cameras { proxy_pass http://darson_backend; }
    location /patterns { proxy_pass http://darson_backend; }
    location /search { proxy_pass http://darson_backend; }
    location = /health { proxy_pass http://darson_backend; }
    location / { proxy_pass http://darson_frontend; }
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
