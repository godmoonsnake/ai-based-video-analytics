# DARSON single-origin reverse proxy.
#
# The browser talks ONLY to this proxy (http://localhost:8080). It routes:
#   /            -> frontend static server (the dashboard SPA)
#   /api/...     -> backend  (v1 incident API lives under /api/v1/...)
#   /events, /tracks, /incidents, /cameras, /patterns, /search, /health -> backend
#   /frigate/... -> Frigate media/API (strip the /frigate prefix)
#
# This keeps everything same-origin (no CORS needed) and makes evidence snapshot
# URLs (built as /frigate/api/events/<id>/snapshot.jpg by the backend) reachable
# from the browser. No secrets or Frigate MQTT credentials are exposed here — the
# proxy only forwards HTTP; credentials stay server-side in the backend/Frigate.

upstream darson_backend  { server backend:8000; }
upstream darson_frontend { server frontend:80; }
upstream darson_frigate  { server frigate:5000; }

server {
    listen 80;
    server_name _;
    # Allow large evidence responses (snapshots/clips).
    client_max_body_size 25m;

    # --- Backend API (v1 + legacy pipeline/demo routes) ---------------------
    # The backend owns these path prefixes; forward them unchanged. Prefixes are
    # matched with or without a trailing slash (and with query strings).
    location /api       { proxy_pass http://darson_backend; }
    location /events    { proxy_pass http://darson_backend; }
    location /tracks    { proxy_pass http://darson_backend; }
    location /incidents { proxy_pass http://darson_backend; }
    location /cameras   { proxy_pass http://darson_backend; }
    location /patterns  { proxy_pass http://darson_backend; }
    location /search    { proxy_pass http://darson_backend; }
    location = /health  { proxy_pass http://darson_backend; }

    # --- Frigate media/API (browser-reachable evidence) ---------------------
    # Strip the /frigate prefix: /frigate/api/events/<id>/snapshot.jpg
    #   -> Frigate  /api/events/<id>/snapshot.jpg
    location /frigate/ {
        proxy_pass http://darson_frigate/;
    }

    # --- Frontend SPA (everything else) -------------------------------------
    location / {
        proxy_pass http://darson_frontend;
    }

    # Common proxy headers.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
